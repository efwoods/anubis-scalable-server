{{- if .Values.externalSecrets.enabled }}
# Secrets Manager -> Kubernetes Secret projection.
#
# One secret per service, each holding the whole environment as a single JSON object.
# `dataFrom.extract` expands every key of that JSON into the Kubernetes Secret, which is
# what lets the Deployments use a single `envFrom.secretRef` for ~200 variables instead
# of enumerating them.
#
# The controller authenticates with the IRSA role from terraform/modules/secrets; the
# ClusterSecretStore references its service account rather than carrying credentials.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    {{- include "anubis-platform.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.aws.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccountName }}
            namespace: {{ .Values.externalSecrets.serviceAccountNamespace }}
{{- range .Values.externalSecrets.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "anubis-platform.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .name }}
    creationPolicy: Owner
    # Every key of the JSON object becomes a key of the Secret, consumed with envFrom.
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: {{ .remoteKey }}
{{- end }}
{{- end }}
